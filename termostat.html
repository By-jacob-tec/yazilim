<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Akıllı Termostat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg: #0d0f14;
    --card: #141720;
    --border: #1e2330;
    --accent: #e8663d;
    --accent2: #3d8fe8;
    --warm: #f0a050;
    --cool: #50b0f0;
    --text: #e8eaf0;
    --muted: #5a6080;
    --green: #4ecb8d;
    --red: #e85050;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 20px 16px 40px;
    overflow-x: hidden;
  }

  /* Arka plan desen */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle at 20% 20%, rgba(232,102,61,0.06) 0%, transparent 50%),
                      radial-gradient(circle at 80% 80%, rgba(61,143,232,0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 420px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    padding-top: 8px;
  }

  .header h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  .header h1 span {
    color: var(--accent);
  }

  .conn-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--card);
    transition: all 0.3s;
  }

  .conn-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: all 0.3s;
  }

  .conn-badge.connected .conn-dot {
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: pulse 2s infinite;
  }

  .conn-badge.connected {
    color: var(--green);
    border-color: rgba(78,203,141,0.2);
  }

  .conn-badge.error .conn-dot { background: var(--red); }
  .conn-badge.error { color: var(--red); border-color: rgba(232,80,80,0.2); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* ANA SICAKLIK KARTI */
  .temp-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 24px;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
  }

  .temp-card::after {
    content: '';
    position: absolute;
    top: -40px;
    right: -40px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232,102,61,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .temp-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .temp-value {
    font-family: 'Syne', sans-serif;
    font-size: 72px;
    font-weight: 800;
    line-height: 1;
    color: var(--text);
    letter-spacing: -3px;
    transition: color 0.5s;
  }

  .temp-value .unit {
    font-size: 28px;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 0;
    vertical-align: super;
    margin-left: 2px;
  }

  .temp-value.warm { color: var(--warm); }
  .temp-value.hot  { color: var(--accent); }
  .temp-value.cool { color: var(--cool); }

  /* NEM + RÖLE SATIRI */
  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 16px;
    position: relative;
    overflow: hidden;
  }

  .stat-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .stat-value {
    font-family: 'Syne', sans-serif;
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
  }

  .stat-value .unit {
    font-size: 14px;
    font-weight: 400;
    color: var(--muted);
  }

  /* RÖLE KARTI */
  .relay-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .relay-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    background: rgba(94,94,94,0.15);
    transition: all 0.4s;
    flex-shrink: 0;
  }

  .relay-icon.active {
    background: rgba(232,102,61,0.15);
    box-shadow: 0 0 20px rgba(232,102,61,0.2);
  }

  .relay-text {
    flex: 1;
  }

  .relay-status {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--muted);
    transition: color 0.4s;
  }

  .relay-status.active { color: var(--accent); }

  .relay-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* HEDEF SICAKLIK KARTI */
  .control-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 14px;
  }

  .control-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .control-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .control-value {
    font-family: 'Syne', sans-serif;
    font-size: 36px;
    font-weight: 800;
    color: var(--accent2);
    letter-spacing: -1px;
  }

  .control-value .unit {
    font-size: 16px;
    font-weight: 400;
    color: var(--muted);
  }

  /* SLIDER */
  .slider-wrap {
    position: relative;
    padding: 10px 0;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent2);
    box-shadow: 0 0 0 4px rgba(61,143,232,0.2), 0 4px 12px rgba(0,0,0,0.4);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  input[type=range]:active::-webkit-slider-thumb {
    transform: scale(1.2);
    box-shadow: 0 0 0 8px rgba(61,143,232,0.15), 0 4px 20px rgba(0,0,0,0.5);
  }

  .slider-minmax {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 11px;
    color: var(--muted);
  }

  /* BUTONLAR */
  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-top: 18px;
  }

  .btn {
    background: var(--border);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 18px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    user-select: none;
  }

  .btn:active { transform: scale(0.93); background: #2a2f3f; }

  .btn-send {
    grid-column: span 3;
    background: var(--accent2);
    border-color: transparent;
    font-size: 13px;
    font-weight: 500;
    color: #fff;
    padding: 16px;
    border-radius: 14px;
    letter-spacing: 1px;
  }

  .btn-send:active { background: #2a7acc; }
  .btn-send.sent { background: var(--green); }

  /* LOG */
  .log-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-top: 14px;
  }

  .log-title {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .log-list {
    list-style: none;
    max-height: 120px;
    overflow-y: auto;
  }

  .log-list li {
    font-size: 11px;
    color: var(--muted);
    padding: 3px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    display: flex;
    gap: 8px;
  }

  .log-list li .log-time { color: var(--accent); flex-shrink: 0; }
  .log-list li.ok .log-msg { color: var(--green); }
  .log-list li.err .log-msg { color: var(--red); }

  /* Animasyon */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .temp-card, .stats-row, .control-card, .log-card {
    animation: fadeIn 0.4s ease both;
  }

  .stats-row { animation-delay: 0.1s; }
  .control-card { animation-delay: 0.2s; }
  .log-card { animation-delay: 0.3s; }

  /* Slider fill trick */
  .slider-track {
    position: relative;
  }
</style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <div class="header">
    <h1>Termo<span>stat</span></h1>
    <div class="conn-badge" id="connBadge">
      <div class="conn-dot"></div>
      <span id="connText">Bağlanıyor</span>
    </div>
  </div>

  <!-- MEVCUT SICAKLIK -->
  <div class="temp-card">
    <div class="temp-label">Mevcut Sıcaklık</div>
    <div class="temp-value" id="tempVal">
      --<span class="unit">°C</span>
    </div>
  </div>

  <!-- NEM + RÖLE -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Nem</div>
      <div class="stat-value" id="humVal">--<span class="unit">%</span></div>
    </div>
    <div class="relay-card">
      <div class="relay-icon" id="relayIcon">🔥</div>
      <div class="relay-text">
        <div class="relay-status" id="relayStatus">Bekliyor</div>
        <div class="relay-sub">Röle durumu</div>
      </div>
    </div>
  </div>

  <!-- HEDEF KONTROL -->
  <div class="control-card">
    <div class="control-header">
      <div class="control-label">Hedef Sıcaklık</div>
      <div class="control-value" id="setVal">25.0<span class="unit">°C</span></div>
    </div>

    <div class="slider-wrap">
      <input type="range" id="tempSlider"
        min="10" max="40" step="0.5" value="25">
      <div class="slider-minmax">
        <span>10°C</span>
        <span>40°C</span>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn" id="btnMinus">−</button>
      <button class="btn" style="font-size:13px; opacity:0.4; cursor:default;">0.5°</button>
      <button class="btn" id="btnPlus">+</button>
      <button class="btn btn-send" id="btnSend">GÖNDER</button>
    </div>
  </div>

  <!-- LOG -->
  <div class="log-card">
    <div class="log-title">Mesaj Günlüğü</div>
    <ul class="log-list" id="logList"></ul>
  </div>

</div>

<script>
  // ====== AYARLAR ======
  const MQTT_HOST   = '2f6d21176e3f4d0bb12ac95eb13a49f6.s1.eu.hivemq.cloud';
  const MQTT_PORT   = 8884;   // WebSocket SSL portu
  const MQTT_USER   = 'ycetin';
  const MQTT_PASS   = 'Et07448144..';
  const CLIENT_ID   = 'WebPanel_' + Math.random().toString(36).substr(2, 6);

  const TOPIC_TEMP  = 'ycetin/termostat/sicaklik';
  const TOPIC_HUM   = 'ycetin/termostat/nem';
  const TOPIC_RELAY = 'ycetin/termostat/role';
  const TOPIC_SET   = 'ycetin/termostat/hedef';
  const TOPIC_CMD   = 'ycetin/termostat/hedef/set';
  // =====================

  let client;
  let currentSet = 25.0;
  let lastSent   = null;

  const slider     = document.getElementById('tempSlider');
  const setValEl   = document.getElementById('setVal');
  const btnSend    = document.getElementById('btnSend');
  const btnPlus    = document.getElementById('btnPlus');
  const btnMinus   = document.getElementById('btnMinus');
  const connBadge  = document.getElementById('connBadge');
  const connText   = document.getElementById('connText');
  const logList    = document.getElementById('logList');

  function log(msg, type='info') {
    const li = document.createElement('li');
    li.className = type;
    const now = new Date();
    const t = now.getHours().toString().padStart(2,'0') + ':' +
              now.getMinutes().toString().padStart(2,'0') + ':' +
              now.getSeconds().toString().padStart(2,'0');
    li.innerHTML = `<span class="log-time">${t}</span><span class="log-msg">${msg}</span>`;
    logList.prepend(li);
    if (logList.children.length > 20) logList.lastChild.remove();
  }

  function setConnState(state) {
    connBadge.className = 'conn-badge ' + state;
    if (state === 'connected') connText.textContent = 'Bağlı';
    else if (state === 'error') connText.textContent = 'Hata';
    else connText.textContent = 'Bağlanıyor';
  }

  function updateSetDisplay(val) {
    currentSet = Math.round(val * 2) / 2;
    slider.value = currentSet;
    setValEl.innerHTML = currentSet.toFixed(1) + '<span class="unit">°C</span>';
  }

  function mqttConnect() {
    client = new Paho.MQTT.Client(MQTT_HOST, MQTT_PORT, CLIENT_ID);

    client.onConnectionLost = (r) => {
      setConnState('error');
      log('Bağlantı koptu: ' + r.errorMessage, 'err');
      setTimeout(mqttConnect, 5000);
    };

    client.onMessageArrived = (msg) => {
      const topic = msg.destinationName;
      const val   = msg.payloadString;

      if (topic === TOPIC_TEMP) {
        const t = parseFloat(val);
        const el = document.getElementById('tempVal');
        let cls = '';
        if (t < 18) cls = 'cool';
        else if (t < 24) cls = '';
        else if (t < 28) cls = 'warm';
        else cls = 'hot';
        el.className = 'temp-value ' + cls;
        el.innerHTML = t.toFixed(1) + '<span class="unit">°C</span>';
      }

      if (topic === TOPIC_HUM) {
        document.getElementById('humVal').innerHTML =
          parseFloat(val).toFixed(0) + '<span class="unit">%</span>';
      }

      if (topic === TOPIC_RELAY) {
        const on = val === '1';
        const icon   = document.getElementById('relayIcon');
        const status = document.getElementById('relayStatus');
        icon.className   = 'relay-icon' + (on ? ' active' : '');
        icon.textContent = on ? '🔥' : '❄️';
        status.className = 'relay-status' + (on ? ' active' : '');
        status.textContent = on ? 'Isıtıyor' : 'Bekliyor';
      }

      if (topic === TOPIC_SET) {
        const v = parseFloat(val);
        if (v !== lastSent) updateSetDisplay(v);
      }
    };

    const opts = {
      useSSL: true,
      userName: MQTT_USER,
      password: MQTT_PASS,
      keepAliveInterval: 30,
      cleanSession: true,
      onSuccess: () => {
        setConnState('connected');
        log('HiveMQ bağlantısı kuruldu', 'ok');
        [TOPIC_TEMP, TOPIC_HUM, TOPIC_RELAY, TOPIC_SET].forEach(t => {
          client.subscribe(t);
        });
      },
      onFailure: (e) => {
        setConnState('error');
        log('Bağlantı hatası: ' + e.errorMessage, 'err');
        setTimeout(mqttConnect, 5000);
      }
    };

    try {
      client.connect(opts);
      log('Bağlanılıyor... (' + CLIENT_ID + ')');
    } catch(e) {
      log('Hata: ' + e, 'err');
    }
  }

  function sendTarget() {
    if (!client || !client.isConnected()) {
      log('Bağlantı yok!', 'err');
      return;
    }
    const msg = new Paho.MQTT.Message(currentSet.toFixed(1));
    msg.destinationName = TOPIC_CMD;
    msg.retained = true;
    client.send(msg);
    lastSent = currentSet;
    log('Hedef gönderildi: ' + currentSet.toFixed(1) + '°C', 'ok');

    btnSend.textContent = '✓ GÖNDERİLDİ';
    btnSend.classList.add('sent');
    setTimeout(() => {
      btnSend.textContent = 'GÖNDER';
      btnSend.classList.remove('sent');
    }, 2000);
  }

  // Slider
  slider.addEventListener('input', () => {
    updateSetDisplay(parseFloat(slider.value));
  });

  // +/- butonları
  btnPlus.addEventListener('click', () => {
    updateSetDisplay(Math.min(40, currentSet + 0.5));
  });
  btnMinus.addEventListener('click', () => {
    updateSetDisplay(Math.max(10, currentSet - 0.5));
  });

  btnSend.addEventListener('click', sendTarget);

  // Başlat
  updateSetDisplay(25);
  mqttConnect();
</script>
</body>
</html>
